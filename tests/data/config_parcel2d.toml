[settings]
workdir = 'example'
start-date = 2020-01-01 # Date in YYYY-MM-DD format
end-date = 2020-12-31 # Date in YYYY-MM-DD format
save-phreatic-head = true # Save the phreatic head results in a NetCDF file in the working directory

[modflow-settings]
modflow-executable = './mfutil/modflow6.exe'
parameters = './data/modflow_parameters.csv'
aquifer-method = "flux"
measure = "ref"

[run-settings]
multiprocessing = true
batch-size = 100 # Run the model in batches of this many parcels at a time
multiprocess-scale = 1.0 # Fraction of available CPU cores to use for multiprocessing (0.0 - 1.0)
log-level = "INFO" # Logging levels: DEBUG, INFO, WARNING, ERROR, CRITICAL

[data]
parcels = './data/parcels.geoparquet'
confining-nc = './data/lhm_confining_layer.nc'
flux-nc = './data/lhm_flux.nc'
recharge-nc = './data/lhm_recharge.nc'
soilmap-gpkg = './data/soilmap.gpkg'

[output]
directory = './output' # Directory where output files will be written
file = "./output/output.parquet"
format = "geoparquet"
prefix = "batch" # Each batch from a single process will be written to a separate file with this prefix
